stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  image: node:latest
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r dist/* public/
    - echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>GitLab Pages</title></head><body><h1>GitLab Pages</h1></body></html>' > public/index.html
  artifacts:
    paths:
      - public
  only:
    - master
